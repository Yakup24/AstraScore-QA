[pytest]
testpaths = tests
pythonpath = src .
addopts = -v
markers =
    smoke: basic availability and health tests
    soap: SOAP scoring tests
    rest: REST/API scoring tests
    db: database validation tests
    negative: negative scenario tests
    performance: simple concurrency/performance checks
    regression: model regression checks
    contract: synthetic request and response contract checks
    boundary: boundary value checks
    report: report writer checks
